<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JGVRP Futuristic HUD</title>
    <link rel="stylesheet" href="style.css">
    <!-- font keren buat tampilannya -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <div id="hud-wrapper">
        <div class="hud-container">
            <!-- efek garis-garis biar keliatan kaya monitor jadul -->
            <div class="scanlines"></div>

            <!-- layar sambutan pas pertama masuk kendaraan -->
            <div id="welcome-screen" class="welcome-layer active">
                <div class="welcome-text">SYSTEM<br>REBOOT...</div>
            </div>

            <!-- bagian kecepatan, ditaruh paling atas -->
            <div class="speed-section">
                <div id="speed" class="speed-value">0</div>
                <div class="speed-unit">MPH</div>
            </div>

            <!-- tampilan RPM digital 4 digit -->
            <div class="rpm-digital">
                <div class="rpm-label">RPM</div>
                <div class="rpm-digits">
                    <span id="rpm-d1" class="digit">0</span>
                    <span id="rpm-d2" class="digit">0</span>
                    <span id="rpm-d3" class="digit">0</span>
                    <span id="rpm-d4" class="digit">0</span>
                </div>
            </div>

            <!-- baris ikon-ikon indikator -->
            <div class="icons-row">
                <div id="sein-l" class="icon indicator-off"><svg viewBox="0 0 24 24"><path d="M8 4L2 12L8 20V17H14V7H8V4Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg></div>
                <div id="engine-icon" class="icon indicator-off"><svg viewBox="0 0 24 24"><path d="M12 2C10 4 10 6 11 8C8 8 5 9 5 12C5 16 8 18 12 18C16 18 19 16 19 12C19 9 16 8 13 8C14 6 14 4 12 2M12 10C10.9 10 10 10.9 10 12C10 13.1 10.9 14 12 14C13.1 14 14 13.1 14 12C14 10.9 13.1 10 12 10Z" fill="currentColor"/></svg></div>
                <div id="lights-icon" class="icon indicator-off"><svg viewBox="0 0 24 24"><g fill="currentColor"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="8" y="8" width="8" height="2" rx="1"/><path d="M7 11L5 16H19L17 11Z"/><rect x="10" y="16" width="4" height="2" rx="1"/><path d="M8 8L6 6M16 8L18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></g></svg></div>
                <div id="seatbelt-icon" class="icon indicator-off"><svg viewBox="0 0 24 24"><g fill="currentColor"><path d="M4 4C3 4 2 5 2 6V12C2 13 3 14 4 14H7V16H6C5 16 4 17 4 18V20C4 21 5 22 6 22H8C9 22 10 21 10 20V18C10 17 9 16 8 16H8V14H16V16H15C14 16 13 17 13 18V20C13 21 14 22 15 22H17C18 22 19 21 19 20V18C19 17 18 16 17 16H16V14H19C20 14 21 13 21 12V6C21 5 20 4 19 4H4Z" stroke="currentColor" stroke-width="1" fill="none"/><rect x="5" y="5" width="14" height="8" fill="currentColor" opacity="0.4"/></g></svg></div>
                <div id="sein-r" class="icon indicator-off"><svg viewBox="0 0 24 24"><path d="M16 4L22 12L16 20V17H10V7H16V4Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg></div>
            </div>

            <!-- baris bawah buat gear, bensin, sama health -->
            <div class="bottom-row">
                <div class="data-box">
                    <div class="label-xsmall">GEAR</div>
                    <div id="gear" class="value-text">N</div>
                </div>
                <div class="data-box">
                    <div class="label-xsmall">FUEL</div>
                    <div class="bar-mini-bg"><div id="fuel-bar" class="bar-fill mini-fill fuel-bg"></div></div>
                </div>
                <div class="data-box">
                    <div class="label-xsmall">HEALTH</div>
                    <div class="bar-mini-bg"><div id="health-bar" class="bar-fill mini-fill health-bg"></div></div>
                </div>
            </div>

            <div id="ending-screen" class="ending-layer active">
                <div class="ending-text">ENGINE<br>OFF...</div>
            </div>

            <!-- kredit pembuat -->
            <div class="credit-section">credit by: bimaak15/B1maF4st</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
