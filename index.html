<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Speedometer - JGVRP</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <h1 class="welcome-title">VEHICLE INITIALIZED</h1>
            <div class="welcome-lines"></div>
        </div>
    </div>

    <!-- Main Speedometer Display -->
    <main class="speedometer" id="mainDisplay">
        <!-- Top Indicators Section -->
        <div class="indicators-section">
            <div class="indicator-group">
                <div class="indicator-item seatbelt-indicator" title="Seatbelt" id="seatbeltLight">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L8 6H4C3 6 3 10 3 10V20H21V10C21 10 21 6 20 6H16L12 2Z"/>
                        <line x1="6" y1="10" x2="6" y2="18"/>
                        <line x1="18" y1="10" x2="18" y2="18"/>
                    </svg>
                </div>
                <div class="indicator-item headlight-indicator" title="Headlights" id="headlightLight">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="8"/>
                        <path d="M5 12C5 8.13 8.13 5 12 5C15.87 5 19 8.13 19 12C19 15.87 15.87 19 12 19C8.13 19 5 15.87 5 12Z"/>
                    </svg>
                </div>
                <div class="indicator-item sein-left-indicator" title="Left Turn" id="seinLeftLight">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="8,16 4,12 8,8 9.4,9.4 6.8,12 9.4,14.6"/>
                    </svg>
                </div>
                <div class="indicator-item sein-right-indicator" title="Right Turn" id="seinRightLight">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="16,8 20,12 16,16 14.6,14.6 17.2,12 14.6,9.4"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Main Display Section -->
        <div class="display-container">
            <!-- Speed and RPM -->
            <div class="speed-section">
                <div class="speed-display">
                    <div class="speed-value" id="speed">&nbsp;</div>
                    <div class="speed-label">SPEED</div>
                </div>
                <div class="rpm-section">
                    <div class="rpm-label">RPM</div>
                    <div class="rpm-bar">
                        <div class="rpm-fill" id="rpmFill"></div>
                    </div>
                    <div class="rpm-value" id="rpm">&nbsp;</div>
                </div>
            </div>

            <!-- Vehicle Stats Grid -->
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">ENGINE</span>
                    <span class="stat-value" id="engine">&nbsp;</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">GEAR</span>
                    <span class="stat-value" id="gear">&nbsp;</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">FUEL</span>
                    <span class="stat-value" id="fuel">&nbsp;</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">HEALTH</span>
                    <span class="stat-value" id="health">&nbsp;</span>
                </div>
            </div>

            <!-- Hidden data fields for JS functions -->
            <div style="display: none;">
                <dd id="headlights">&nbsp;</dd>
                <dd id="indicators">&nbsp;</dd>
                <dd id="seatbelts">&nbsp;</dd>
                <dd id="odometer">&nbsp;</dd>
            </div>
        </div>

        <!-- Credit Section -->
        <div class="credit-text">
            credit by: bimaak15/B1maF4st
        </div>
    </main>

    <script src="/script.js"></script>
    <script>
        // Handle welcome screen visibility (non-destructive initialization)
        window.addEventListener('DOMContentLoaded', function() {
            const welcomeScreen = document.getElementById('welcomeScreen');
            const mainDisplay = document.getElementById('mainDisplay');
            
            if (welcomeScreen && mainDisplay) {
                // Hide welcome screen after 3 seconds
                setTimeout(function() {
                    welcomeScreen.classList.add('hidden');
                }, 3000);
            }

            // Enhanced indicator lighting system
            const seatbeltLight = document.getElementById('seatbeltLight');
            const headlightLight = document.getElementById('headlightLight');
            const seinLeftLight = document.getElementById('seinLeftLight');
            const seinRightLight = document.getElementById('seinRightLight');
            const rpmFill = document.getElementById('rpmFill');

            // Intercept setSeatbelts to update indicator light
            const originalSetSeatbelts = window.setSeatbelts;
            if (originalSetSeatbelts) {
                window.setSeatbelts = function(state) {
                    originalSetSeatbelts(state);
                    if (seatbeltLight) {
                        seatbeltLight.classList.toggle('active', state);
                        seatbeltLight.classList.toggle('inactive', !state);
                    }
                };
            }

            // Intercept setHeadlights to update indicator light
            const originalSetHeadlights = window.setHeadlights;
            if (originalSetHeadlights) {
                window.setHeadlights = function(state) {
                    originalSetHeadlights(state);
                    if (headlightLight) {
                        headlightLight.classList.toggle('active', state > 0);
                        headlightLight.classList.toggle('inactive', state === 0);
                    }
                };
            }

            // Intercept setLeftIndicator to update sein light
            const originalSetLeftIndicator = window.setLeftIndicator;
            if (originalSetLeftIndicator) {
                window.setLeftIndicator = function(state) {
                    originalSetLeftIndicator(state);
                    if (seinLeftLight) {
                        seinLeftLight.classList.toggle('active', state);
                        seinLeftLight.classList.toggle('inactive', !state);
                    }
                };
            }

            // Intercept setRightIndicator to update sein light
            const originalSetRightIndicator = window.setRightIndicator;
            if (originalSetRightIndicator) {
                window.setRightIndicator = function(state) {
                    originalSetRightIndicator(state);
                    if (seinRightLight) {
                        seinRightLight.classList.toggle('active', state);
                        seinRightLight.classList.toggle('inactive', !state);
                    }
                };
            }

            // Intercept setRPM to update RPM bar fill
            const originalSetRPM = window.setRPM;
            if (originalSetRPM) {
                window.setRPM = function(rpm) {
                    originalSetRPM(rpm);
                    if (rpmFill) {
                        rpmFill.style.width = (rpm * 100) + '%';
                    }
                };
            }
        });
    </script>
</body>
</html>
